; ---- PHP2Shell temporary mitigation start (remove this block after you apply the patch) ----
; Where: the very end of /etc/php/8.3/fpm/pool.d/www.conf (inside the [www] pool)
; Basis: the partial mitigation items in the official PHP security advisory (2026-10-21). Not a complete fix.
;
; The application cannot change php_admin_value with ini_set().
; Set through .user.ini or ini_set() in code, it applies later than request parsing and has no effect.

; Reduces the path of CVE-2026-109618 (out-of-memory handling).
; In exchange one request can use unlimited memory, so also set a container or cgroup memory limit.
php_admin_value[memory_limit] = -1

; Reduce the request body size accepted. 8M if there are no uploads, otherwise only as much as the service needs.
php_admin_value[post_max_size] = 8M
php_admin_value[upload_max_filesize] = 5M

; Turn off session upload progress, one of the paths of CVE-2026-109619 (reuse of leftover state).
php_admin_flag[session.upload_progress.enabled] = off

; If you use PHP 8.5, add the next line too. (Not a setting in 8.3, so it is commented out in this lab)
; php_admin_flag[fatal_error_backtraces] = off
; ---- PHP2Shell temporary mitigation end ----
