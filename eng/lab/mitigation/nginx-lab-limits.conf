# PHP2Shell temporary mitigation: cut requests at the web server before they reach PHP (fine to keep after patching)
# Where: /etc/nginx/lab-limits.conf  (the server block of the lab server includes this file)
# On a real server, put the same content inside the server { ... } block.

# Maximum request body size. Match PHP's post_max_size.
client_max_body_size 8m;

# Accept multipart (file upload format) requests only at addresses that have an upload feature.
# In this service only notice posting (/post.php) and XML import (/import.php) take files.
set $lab_block_multipart 0;
if ($content_type ~* "^multipart/form-data") {
    set $lab_block_multipart 1;
}
if ($uri ~ "^/(post|import)\.php$") {
    set $lab_block_multipart 0;
}
if ($lab_block_multipart) {
    return 415;
}
