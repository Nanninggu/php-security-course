# PHP2Shell 임시 완화: PHP까지 가기 전에 웹 서버에서 요청을 줄인다 (패치 후에도 유지해도 좋은 설정)
# 넣는 곳: /etc/nginx/lab-limits.conf  (실습 서버의 server 블록이 이 파일을 include 한다)
# 실제 서버라면 server { ... } 블록 안에 같은 내용을 넣는다.

# 요청 본문 최대 크기. PHP의 post_max_size와 맞춘다.
client_max_body_size 8m;

# multipart(파일 업로드 형식) 요청은 업로드 기능이 있는 주소에서만 받는다.
# 이 서비스에서는 공지 등록(/post.php)과 XML 가져오기(/import.php)만 파일을 받는다.
set $lab_block_multipart 0;
if ($content_type ~* "^multipart/form-data") {
    set $lab_block_multipart 1;
}
if ($uri ~ "^/(post|import)\.php$") {
    set $lab_block_multipart 0;
}
if ($lab_block_multipart) {
    return 415;
}
