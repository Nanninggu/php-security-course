; ---- PHP2Shell 임시 완화 시작 (패치를 적용하면 이 블록을 지운다) ----
; 넣는 곳: /etc/php/8.3/fpm/pool.d/www.conf 맨 끝 ([www] 풀 설정 안)
; 근거: PHP 공식 보안 공지(2026-10-21)의 부분 완화 항목. 완전한 해결책이 아니다.
;
; php_admin_value는 애플리케이션이 ini_set()으로 바꿀 수 없다.
; .user.ini나 코드의 ini_set()으로 넣으면 요청 파싱보다 늦게 적용되어 효과가 없다.

; CVE-2026-109618(메모리 부족 처리) 경로를 줄인다.
; 대신 요청 하나가 메모리를 무제한으로 쓸 수 있으므로 컨테이너·cgroup 메모리 제한을 함께 둔다.
php_admin_value[memory_limit] = -1

; 받을 수 있는 요청 본문 크기를 줄인다. 업로드가 없으면 8M, 있으면 서비스에 필요한 만큼만.
php_admin_value[post_max_size] = 8M
php_admin_value[upload_max_filesize] = 5M

; CVE-2026-109619(남은 상태 재사용) 경로 중 하나인 세션 업로드 진행 기능을 끈다.
php_admin_flag[session.upload_progress.enabled] = off

; PHP 8.5를 쓴다면 다음 줄도 넣는다. (8.3에는 없는 설정이라 이 실습에서는 주석)
; php_admin_flag[fatal_error_backtraces] = off
; ---- PHP2Shell 임시 완화 끝 ----
