server {
    listen 80 default_server;
    server_name _;
    root /var/www/app/public;
    index index.php;

    # 3-3 임시 완화에서 이 위치에 요청 제한 설정을 넣는다
    include /etc/nginx/lab-limits*.conf;

    # 런타임 확인용 페이지는 서버 안에서만 열 수 있다 (외부 공개 금지)
    location /lab/ {
        allow 127.0.0.1;
        deny all;
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        }
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
